name: parence_student
description: Student dashboard mobile application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/welcome-back.png
    - assets/grandview-logo.jpg
    - assets/education-tools-background.png
    - assets/generated-navigation-icons.png
    - assets/student-avatar.png
  fonts:
    - family: KhmerOS
      fonts:
        - asset: assets/KhmerOS.ttf
