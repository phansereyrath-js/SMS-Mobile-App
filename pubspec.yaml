name: pastel_auth_ui
description: "Grandview School student mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.3
  cupertino_icons: ^2.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
  fonts:
    - family: KhmerOS
      fonts:
        - asset: assets/KhmerOS.ttf
